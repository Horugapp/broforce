name: Build NDS ROM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilar
        run: make

      - name: Subir .nds como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bro-dash-ds
          path: '*.nds'
